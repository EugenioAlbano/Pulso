<title>Pulso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: app de celular em coluna única (máx. 560px), barra superior por tela, navegação inferior fixa */
:root{
  --bg:#EEF1F4; --card:#FFFFFF; --ink:#15202C; --muted:#5A6573; --line:#D7DDE3;
  --accent:#2B59FF; --accent-ink:#FFFFFF; --accent-soft:#E3EAFF; --joint:#E2672E; --pink:#E91E8C; --violet:#7A3DFF;
  --ok:#1F7A55; --ok-soft:#DDF1E7; --bad:#B23A3A; --bad-soft:#F8E1E1; --warn:#9A6400; --warn-soft:#FBEFD6;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151B; --card:#1A2129; --ink:#E7ECF0; --muted:#9AA6B2; --line:#2C3640;
  --accent:#7FA2FF; --accent-ink:#0E1626; --accent-soft:#222E48; --joint:#F08A55; --pink:#FF63B1; --violet:#A98BFF;
  --ok:#5CC197; --ok-soft:#173327; --bad:#E57D7D; --bad-soft:#3A1E1E; --warn:#E7B45A; --warn-soft:#3A2D14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151B; --card:#1A2129; --ink:#E7ECF0; --muted:#9AA6B2; --line:#2C3640;
  --accent:#7FA2FF; --accent-ink:#0E1626; --accent-soft:#222E48; --joint:#F08A55; --pink:#FF63B1; --violet:#A98BFF;
  --ok:#5CC197; --ok-soft:#173327; --bad:#E57D7D; --bad-soft:#3A1E1E; --warn:#E7B45A; --warn-soft:#3A2D14; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding:0 16px}
#app{max-width:560px;margin:0 auto;padding-block:12px 32px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2rem;line-height:1.05} h2{font-size:1.4rem;line-height:1.1} h3{font-size:1.2rem;line-height:1.1}
.top{display:flex;align-items:center;gap:10px;min-height:44px}
.top h1{flex:1;min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.88rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
button,.btn{font:600 .95rem var(--body);border-radius:10px;padding:10px 14px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:42px}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ok{background:var(--ok);color:var(--card);border-color:var(--ok)}
button.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:8px 10px}
button.danger{color:var(--bad);border-color:var(--bad)}
button.icon{width:42px;padding:0;display:inline-grid;place-items:center;font-size:1.2rem}
button:disabled{opacity:.5}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tap:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:4px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-height:42px}
textarea{min-height:80px}
.err{color:var(--bad);font-size:.85rem;margin-top:4px}
.fields{display:grid;gap:12px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.tap{cursor:pointer}
.chip{font-family:var(--mono);font-size:.75rem;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:.88rem}
.tcard{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center}
.letter{font-family:var(--display);font-weight:700;font-size:2.6rem;color:var(--accent);text-align:center;line-height:1}
.count{text-align:center;font-family:var(--display);font-weight:700;font-size:1.6rem;color:var(--accent);line-height:1}
.count small{display:block;font-family:var(--body);font-size:.7rem;font-weight:600}
.nav{position:sticky;top:0;z-index:5;max-width:560px;margin:0 auto;background:var(--bg);border-bottom:1px solid var(--line);padding-top:max(6px,env(safe-area-inset-top,0px));display:flex;gap:4px}
.nav button{flex:1;border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;color:var(--muted);display:flex;flex-direction:row;align-items:center;justify-content:center;gap:6px;font-size:.95rem;font-weight:700;padding:12px 6px;min-height:48px}
.nav button[aria-current="page"]{color:var(--accent);border-bottom-color:var(--pink)}
.nav svg{width:20px;height:20px;flex:none}
@media (max-width:380px){.nav button{font-size:.85rem;gap:4px}.nav svg{width:18px;height:18px}}
.exrow{display:grid;grid-template-columns:56px minmax(0,1fr) 18px;gap:12px;align-items:center}
.thumb{width:56px;height:56px;border-radius:8px;background:var(--bg);overflow:hidden}
.thumb svg,.stage svg{width:100%;height:100%;display:block}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dot.half{border-color:var(--ok);background:linear-gradient(90deg,var(--ok) 50%,transparent 50%)}
.dot.full{border-color:var(--ok);background:var(--ok)}
.rx{font-family:var(--mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.timerbar{display:flex;justify-content:space-between;align-items:center;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 14px;gap:10px}
.timerbar .big{font-family:var(--mono);font-size:1.5rem}
.stage{background:var(--bg);border-radius:10px;aspect-ratio:1;max-width:380px;width:100%;margin:0 auto;position:relative}
.ph{display:grid;place-items:center;height:100%;color:var(--muted);font-size:.85rem;text-align:center;padding:16px}
.sets{display:grid;gap:8px}
.set{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:end}
.bub{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--card);font:600 1rem var(--mono);color:var(--muted);padding:0;min-height:0}
.bub.done{background:var(--ok);border-color:var(--ok);color:var(--card)}
.bub.next{border-color:var(--accent);color:var(--accent)}
.set input{text-align:center;font-family:var(--mono)}
.rest{background:var(--card);border:2px solid var(--accent);border-radius:14px;padding:16px;text-align:center;display:grid;gap:10px}
.rest.alarm{border-color:var(--ok);background:var(--ok-soft)}
.rest .clock{font-family:var(--mono);font-size:3rem;line-height:1}
.bar{height:6px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s linear}
.tips{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px;font-size:.93rem}
.tips li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:6px}
.do li::before{content:"✓";color:var(--ok);font-weight:600}
.dont li::before{content:"✕";color:var(--bad);font-weight:600}
.edex{display:grid;gap:8px}
.edgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.edgrid input{text-align:center;font-family:var(--mono);padding:8px 4px}
.edgrid label{font-size:.72rem;text-align:center}
.pick{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.pick .thumb{width:44px;height:44px}
.hist{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.dur{font-family:var(--display);font-weight:700;font-size:1.6rem;color:var(--accent);text-align:right;line-height:1}
.dur small{display:block;font-family:var(--body);font-size:.72rem;color:var(--muted);font-weight:600}
.empty{text-align:center;padding:28px 16px;display:grid;gap:10px;justify-items:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:6px 10px;min-height:34px;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
.hero{background:linear-gradient(135deg,#E91E8C 0%,#7A3DFF 55%,#2B59FF 100%);color:#fff;border-radius:20px;padding:18px 18px 20px;display:flex;flex-direction:column;gap:6px;box-shadow:0 10px 24px -12px rgba(122,61,255,.7)}
.hero .brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:1.15rem;letter-spacing:.2em;text-transform:uppercase;opacity:.95}
.hero .brand svg{width:34px;height:20px}
.hero h1{font-size:2.4rem;color:#fff}
.hero .sub{font-size:.95rem;opacity:.92}
.hero .ghost{align-self:flex-start;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:6px 14px;font-weight:600;margin-top:6px}
.stat.s1{background:linear-gradient(145deg,#E91E8C,#FF5CAE);color:#fff;border:0}
.stat.s2{background:linear-gradient(145deg,#2B59FF,#5D86FF);color:#fff;border:0}
.stat.s3{background:linear-gradient(145deg,#7A3DFF,#AE82FF);color:#fff;border:0}
.stat.s1 span,.stat.s2 span,.stat.s3 span{color:rgba(255,255,255,.92)}
button.pri.grad{background:linear-gradient(90deg,#E91E8C,#2B59FF);border:0;color:#fff}
details.inst{padding:12px 14px}
details.inst summary{cursor:pointer;font-weight:600;display:flex;align-items:center;gap:8px;list-style:none}
details.inst summary::-webkit-details-marker{display:none}
details.inst summary svg{width:20px;height:20px;color:var(--pink);flex:none}
details.inst ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
details.inst h3{font-size:1rem;margin:10px 0 2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:2rem;line-height:1}
.stat span{font-size:.78rem;color:var(--muted)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.pcard{display:flex;gap:12px;align-items:center}
.pcard .av{width:46px;height:46px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-size:1.5rem;flex:none}
a.wa{display:inline-block;text-decoration:none;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:10px;padding:8px 12px}
</style>
</head><body>

/* ---------- Utilidades ---------- */
const numOrTxt=v=>{const t=String(v??"").trim().replace(",",".");return t!==""&&/^\d+(\.\d+)?$/.test(t)?parseFloat(t):t.replace(/\s*[-–]\s*/g,"-").replace(/\s*\/\s*/g,"/")};
const repsSet=(r,n)=>{if(typeof r==="string"&&r.includes("/")){const p=r.split("/").map(x=>numOrTxt(x)).filter(x=>x!=="");return Array.from({length:n},(_,i)=>p.length?p[Math.min(i,p.length-1)]:0)}return Array.from({length:n},()=>r)};
const repsTxt=e=>{const r=e.sets.map(x=>x.reps);return r.every(x=>x===r[0])?e.sets.length+" × "+r[0]:r.join(" / ")};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mmss=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+":"+String(m).padStart(2,"0"):String(m).padStart(2,"0"))+":"+String(x).padStart(2,"0")};
const fmtData=ms=>new Date(ms).toLocaleDateString("pt-BR");
const fmtDia=ms=>{const d=new Date(ms);const w=d.toLocaleDateString("pt-BR",{weekday:"long"});return w.charAt(0).toUpperCase()+w.slice(1).replace("-feira","")+" · "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})};
const carga=c=>(+c>0?String(c).replace(".",",")+" kg":"");

const normN=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const toks=t=>normN(t).split(" ").filter(w=>w.length>2);
function matchEx(nome){const n=normN(nome);if(!n)return null;let best=null,bs=0;const tn=toks(nome);
 for(const k in LIB){const x=LIB[k];if(!x||!x.a)continue;const m=normN(x.nome);if(m===n)return k;const tm=toks(x.nome);if(!tn.length||!tm.length)continue;
  const sh=tn.filter(w=>tm.includes(w)).length;const sc=sh/Math.max(tn.length,tm.length);if(sc>bs){bs=sc;best=k}}
 return bs>=.6?best:null}
function healEx(e){if(e&&e.nome&&!(LIB[e.ex]&&LIB[e.ex].a)){const k=matchEx(e.nome);if(k)e.ex=k}}
function healAll(){try{(D.alunos||[]).forEach(a=>Object.values(a.treinos||{}).forEach(t=>(t.exs||[]).forEach(healEx)));
 if(D.ficha)Object.values(D.ficha.treinos||{}).forEach(t=>(t.exs||[]).forEach(healEx));
 if(RUN)RUN.exs.forEach(healEx);if(V&&V.draft)V.draft.exs.forEach(healEx)}catch(e){}}

 const a=V.id?D.alunos.find(x=>x.id===V.id):null;
 const hoje=new Date().toISOString().slice(0,10);
 app.innerHTML=`<div class="top"><button class="icon ghost" id="back" aria-label="Voltar">‹</button><h1>${a?"Editar aluno":"Novo aluno"}</h1></div>
 <form class="card fields" id="f" novalidate>
  <div><label for="nome">Nome</label><input id="nome" value="${esc(a?.nome)}" placeholder="Ana Souza" autocomplete="off"><div class="err" id="e-nome" hidden></div></div>
  <div class="two"><div><label for="obj">Objetivo</label><select id="obj">${OBJETIVOS.map(o=>`<option ${o===(a?.objetivo||"Não definido")?"selected":""}>${o}</option>`).join("")}</select></div>
  <div><label for="ini">Data de início</label><input id="ini" type="date" value="${esc(a?.inicio||hoje)}"></div></div>
  <div><label for="obs">Observações (lesões, restrições, preferências)</label><textarea id="obs" placeholder="Dor no joelho esquerdo; evitar impacto.">${esc(a?.obs)}</textarea></div>
  <button class="pri" type="submit">Salvar</button>
  ${a?`<div id="delwrap"><button type="button" class="danger" id="del">Excluir aluno</button></div>`:""}
 </form>`;
 $("#back").onclick=()=>a?go("aluno",{id:a.id}):go("alunos");
 $("#nome").oninput=()=>$("#e-nome").hidden=true;
 $("#f").onsubmit=async e=>{e.preventDefault();const nome=$("#nome").value.trim();
  if(!nome){const er=$("#e-nome");er.textContent="Digite o nome do aluno.";er.hidden=false;$("#nome").focus();return}
  const novo={...(a||{id:uid(),treinos:{},criado:Date.now()}),nome,objetivo:$("#obj").value,inicio:$("#ini").value,obs:$("#obs").value.trim()};
  saveAluno(novo);toast("Aluno salvo");go("aluno",{id:novo.id})};
 if(a)$("#del").onclick=()=>{$("#delwrap").innerHTML=`<p class="small" style="margin:0 0 8px">Excluir ${esc(a.nome)}, os treinos e o histórico dele? Não dá para desfazer.</p><div class="row"><button type="button" class="danger" id="sim">Excluir</button><button type="button" id="nao">Cancelar</button></div>`;
  $("#sim").onclick=()=>{deleteAluno(a.id);toast("Aluno excluído");go("alunos")};$("#nao").onclick=()=>render()};
};

VIEWS.aluno=()=>{
 const a=D.alunos.find(x=>x.id===V.id);if(!a)return go("alunos");
 const ts=Object.keys(a.treinos||{}).sort();const ult=lastFor(a.id);
 app.innerHTML=`<div class="top"><button class="icon ghost" id="back" aria-label="Voltar">‹</button><h1>${esc(a.nome)}</h1><button class="ghost" id="ed">Editar</button></div>
 <div class="card two"><div><div class="muted small">Objetivo</div><b>${esc(a.objetivo||"Não definido")}</b></div><div><div class="muted small">Data de início</div><b class="mono">${a.inicio?a.inicio.split("-").reverse().join("/"):"—"}</b></div>
 ${a.obs?`<div style="grid-column:1/-1"><div class="muted small">Observações</div>${esc(a.obs)}</div>`:""}
 <div style="grid-column:1/-1"><div class="muted small">Código de acesso do aluno</div><div class="row" style="margin-top:4px"><b class="mono grow" style="font-size:1.25rem;letter-spacing:.08em">${esc(a.codigo||"gerando…")}</b><button id="copy" ${a.codigo?"":"disabled"}>Copiar</button></div><div class="small" style="margin-top:4px">${a.vinculado?'<span style="color:var(--ok);font-weight:600">O aluno já entrou com este código.</span>':'<span class="muted">Mande este código ao aluno. Ele cria a conta como Aluno e digita o código.</span>'}</div><span class="small" id="cst" aria-live="polite"></span></div></div>
 <div class="list">${ts.map(l=>{const t=a.treinos[l];return`<div class="card tcard"><div class="letter">${l}</div>
  <div class="tap" data-ed="${l}" tabindex="0"><div class="muted small">Grupos musculares</div><b>${esc(t.grupos||"—")}</b></div>
  <div class="count">${(t.exs||[]).length}<small>exercícios</small></div>
  <div class="row" style="grid-column:1/-1"><button class="pri grow" data-go="${l}" ${(t.exs||[]).length?"":"disabled"}>Iniciar treino ${l}</button><button data-ed="${l}">Editar</button></div></div>`}).join("")}
 </div>
 ${ts.length<6?`<button id="add">+ Adicionar treino ${"ABCDEF"[ts.length]}</button>`:""}
 ${ult?`<div class="card small">Último treino registrado: <b>Treino ${ult.letra}</b> em ${fmtData(ult.inicio)}, duração ${mmss(ult.dur)}</div>`:""}`;
 $("#back").onclick=()=>go("alunos");$("#ed").onclick=()=>go("alunoForm",{id:a.id});
 $("#copy").onclick=()=>{const c=a.codigo||"";const ok=()=>$("#cst").textContent="Código copiado. Cole no WhatsApp do aluno.";const fb=()=>$("#cst").textContent="Anote o código: "+c;try{navigator.clipboard.writeText(c).then(ok,fb)}catch(e){fb()}};
 $("#add")&&($("#add").onclick=()=>go("treinoEdit",{id:a.id,letra:"ABCDEF"[ts.length],novo:1}));
 app.querySelectorAll("[data-ed]").forEach(b=>{const f=()=>go("treinoEdit",{id:a.id,letra:b.dataset.ed});b.onclick=f;b.onkeydown=e=>{if(e.key==="Enter")f()}});
 app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>startRun(a,b.dataset.go));
};

VIEWS.treinoEdit=()=>{
 const a=D.alunos.find(x=>x.id===V.id);if(!a)return go("alunos");
 if(!V.draft){const t=(a.treinos||{})[V.letra];V.draft=t?JSON.parse(JSON.stringify(t)):{grupos:"",exs:[]}}
 const d=V.draft;
 app.innerHTML=`<div class="top"><button class="icon ghost" id="back" aria-label="Voltar">‹</button><h1>Treino ${V.letra} · ${esc(a.nome)}</h1></div>
 <div class="card fields"><div><label for="grupos">Grupos musculares</label><input id="grupos" value="${esc(d.grupos)}" placeholder="Glúteo e perna"></div>
 <div><label for="mod">Começar de um modelo pronto</label><div class="row"><select id="mod" class="grow" style="width:auto">${Object.keys(MODELOS).map(m=>`<option>${m}</option>`).join("")}</select><button type="button" id="aplica">Usar modelo</button></div><div class="small muted" style="margin-top:4px">Os exercícios do modelo entram no fim da lista. Ajuste séries, repetições e descanso. A carga quem anota é o aluno.</div></div></div>
 <div class="list" id="exs">${d.exs.map((e,i)=>`<div class="card edex"><div class="row"><div class="thumb" data-fig="${e.ex}"></div><div class="grow"><b>${i+1}. ${esc(exNome(e))}</b></div>
  <button class="icon ghost" data-up="${i}" aria-label="Subir" ${i?"":"disabled"}>↑</button><button class="icon ghost" data-dn="${i}" aria-label="Descer" ${i<d.exs.length-1?"":"disabled"}>↓</button><button class="icon ghost" data-rm="${i}" aria-label="Remover" style="color:var(--bad)">×</button></div>
  <div class="edgrid">${[["series","Séries"],["reps",isTempo(e)?"Segundos":"Repetições"],["descanso","Descanso s"]].map(([k,l])=>`<div><label for="${k}${i}">${l}</label><input id="${k}${i}" inputmode="${k==="reps"?"text":"decimal"}" ${k==="reps"?'placeholder="12, 8-12 ou 12/10/8"':""} data-i="${i}" data-k="${k}" value="${esc(e[k])}"></div>`).join("")}</div>
  ${i===0?'<div class="small muted">Repetições: use 12, uma faixa como 8-12, ou uma por série separadas por barra, como 12/10/8/6.</div>':""}
  <div><label for="obs${i}">Observação para o aluno</label><input id="obs${i}" data-i="${i}" data-k="obs" value="${esc(e.obs)}" placeholder="Cadência 3 s na descida"></div></div>`).join("")}
 </div>
 ${!d.exs.length?'<div class="card empty"><p class="muted" style="margin:0">Use um modelo acima ou adicione exercícios um a um.</p></div>':""}
 <button id="addEx">+ Adicionar exercício</button>
 <div class="err" id="e-save" hidden></div>
 <div class="row"><button class="pri grow" id="save">Salvar treino</button>${!V.novo?'<button class="danger" id="delT">Excluir treino</button>':""}</div>`;
 app.querySelectorAll("[data-fig]").forEach(h=>figure(h,h.dataset.fig,true));
 const syncInputs=()=>{d.grupos=$("#grupos").value;app.querySelectorAll("[data-k]").forEach(inp=>{const e=d.exs[+inp.dataset.i];const k=inp.dataset.k;e[k]=k==="obs"?inp.value:k==="reps"?(numOrTxt(inp.value)||0):(parseFloat(String(inp.value).replace(",","."))||0)})};
 $("#back").onclick=()=>go("aluno",{id:a.id});
 $("#aplica").onclick=()=>{syncInputs();const m=MODELOS[$("#mod").value];if(!d.grupos)d.grupos=m.grupos;
  m.exs.forEach(([ex,series,reps,carga,descanso])=>d.exs.push({id:uid(),ex,series,reps,carga:0,descanso,obs:""}));render()};
 app.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{syncInputs();const i=+b.dataset.up;[d.exs[i-1],d.exs[i]]=[d.exs[i],d.exs[i-1]];render()});
 app.querySelectorAll("[data-dn]").forEach(b=>b.onclick=()=>{syncInputs();const i=+b.dataset.dn;[d.exs[i+1],d.exs[i]]=[d.exs[i],d.exs[i+1]];render()});
 app.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{syncInputs();d.exs.splice(+b.dataset.rm,1);render()});
 $("#addEx").onclick=()=>{syncInputs();go("picker",{id:a.id,letra:V.letra,draft:d,novo:V.novo})};
 $("#save").onclick=()=>{syncInputs();
  if(!d.exs.length){const er=$("#e-save");er.textContent="Adicione pelo menos um exercício antes de salvar.";er.hidden=false;return}
  d.exs.forEach(e=>{e.series=Math.max(1,Math.round(e.series)||1)});
  saveAluno({...a,treinos:{...(a.treinos||{}),[V.letra]:d}});toast("Treino "+V.letra+" salvo");go("aluno",{id:a.id})};
 $("#delT")&&($("#delT").onclick=()=>{const t={...a.treinos};delete t[V.letra];saveAluno({...a,treinos:t});toast("Treino excluído");go("aluno",{id:a.id})});
};

VIEWS.picker=()=>{
 const grupos={};Object.entries(LIB).forEach(([k,x])=>(grupos[x.grupo]=grupos[x.grupo]||[]).push([k,x]));
 app.innerHTML=`<div class="top"><button class="icon ghost" id="back" aria-label="Voltar">‹</button><h1>Adicionar exercício</h1></div>
 <form class="card fields" id="cf" novalidate><div><label for="cn">Exercício que não está na lista</label><div class="row"><input id="cn" class="grow" placeholder="Agachamento sumô" style="width:auto"><button class="pri" type="submit">Adicionar</button></div><div class="err" id="e-cn" hidden></div></div></form>
 ${Object.entries(grupos).map(([g,xs])=>`<div class="card"><h3>${g}</h3>${xs.map(([k,x])=>`<div class="pick"><div class="thumb" data-fig="${k}"></div><div>${esc(x.nome)}</div><button data-k="${k}">Adicionar</button></div>`).join("")}</div>`).join("")}`;
 app.querySelectorAll("[data-fig]").forEach(h=>figure(h,h.dataset.fig,true));
 const back=()=>go("treinoEdit",{id:V.id,letra:V.letra,draft:V.draft,novo:V.novo});
 $("#back").onclick=back;
 const add=(ex,nome)=>{V.draft.exs.push({id:uid(),ex,nome,series:3,reps:LIB[ex]&&LIB[ex].tempo?30:12,carga:0,descanso:60,obs:""});toast("Adicionado: "+(nome||LIB[ex].nome));back()};
 app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>add(b.dataset.k));
 $("#cn").oninput=()=>$("#e-cn").hidden=true;
 $("#cf").onsubmit=e=>{e.preventDefault();const n=$("#cn").value.trim();if(!n){$("#e-cn").textContent="Digite o nome do exercício.";$("#e-cn").hidden=false;return}add("custom",n)};
};

/* ---------- Execução do treino ---------- */
let RUN=lsGet("ft-run",null);
const saveRun=()=>lsSet("ft-run",RUN);
let audioCtx=null,wake=null;
function unlockAudio(){try{if(!audioCtx){const C=window.AudioContext||window.webkitAudioContext;if(C)audioCtx=new C()}audioCtx&&audioCtx.state==="suspended"&&audioCtx.resume()}catch(e){}}
function beep(){try{if(!audioCtx)return;[0,.35,.7].forEach(t=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;o.type="sine";o.connect(g);g.connect(audioCtx.destination);
 const s=audioCtx.currentTime+t;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.4,s+.02);g.gain.linearRampToValueAtTime(0,s+.25);o.start(s);o.stop(s+.27)})}catch(e){}
 try{navigator.vibrate&&navigator.vibrate([300,150,300,150,300])}catch(e){}}
async function keepAwake(){try{if(navigator.wakeLock&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>wake=null)}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&RUN)keepAwake()});

function startRun(a,l){
 unlockAudio();
 if(RUN&&!(RUN.alunoId===a.id&&RUN.letra===l)){V={name:"confirmRun",a,l};return render()}
 if(!RUN){const t=a.treinos[l];
  RUN={alunoId:a.id,alunoNome:a.nome,letra:l,grupos:t.grupos,inicio:Date.now(),idx:0,exAcc:0,exStart:null,rest:null,
   exs:t.exs.map(e=>{const last=D.hist.filter(h=>h.alunoId===a.id&&h.letra===l).sort((x,y)=>y.inicio-x.inicio).map(h=>h.exs.find(z=>z.nome===exNome(e))).find(z=>z&&z.sets.some(q=>q.feito&&+q.carga>0));const ult=last?last.sets.filter(q=>q.feito&&+q.carga>0).pop().carga:e.carga;return{...e,sets:repsSet(e.reps,e.series).map(r=>({reps:r,carga:ult||0,feito:false}))}})};saveRun()}
 keepAwake();go("run");
}
VIEWS.confirmRun=()=>{app.innerHTML=`<div class="card fields"><h2>Já existe um treino em andamento</h2><p style="margin:0">${esc(RUN.alunoNome)} · Treino ${RUN.letra}, iniciado às ${new Date(RUN.inicio).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}.</p>
 <div class="row"><button class="pri" id="cont">Continuar esse treino</button><button class="danger" id="desc">Descartar e iniciar o novo</button></div></div>`;
 $("#cont").onclick=()=>go("run");$("#desc").onclick=()=>{RUN=null;saveRun();startRun(V.a,V.l)}};

const doneCount=e=>e.sets.filter(s=>s.feito).length;
VIEWS.run=()=>{
 if(!RUN)return go("alunos");
 const tot=RUN.exs.reduce((n,e)=>n+e.sets.length,0),fe=RUN.exs.reduce((n,e)=>n+doneCount(e),0);
 app.innerHTML=`<div class="timerbar"><div><div style="font-family:var(--display);font-weight:700;font-size:1.3rem">Treino ${RUN.letra} · ${esc(RUN.alunoNome)}</div><div class="small">${fe} de ${tot} séries feitas</div></div><div class="big" id="tTot">${mmss((Date.now()-RUN.inicio)/1000)}</div></div>
 <div class="list">${RUN.exs.map((e,i)=>{const c=doneCount(e);const s0=e.sets[0];return`<div class="card exrow tap" tabindex="0" data-i="${i}"><div class="thumb" data-fig="${e.ex}"></div>
  <div><b>${esc(exNome(e))}</b><div class="rx">${repsTxt(e)}${isTempo(e)?" s":""}${+s0.carga>0?" · "+carga(s0.carga):""}</div></div>
  <span class="dot ${c===e.sets.length?"full":c?"half":""}" aria-label="${c} de ${e.sets.length} séries"></span></div>`}).join("")}</div>
 <div class="row"><button class="pri grow" id="cont">Continuar</button><button class="ok" id="fim">Finalizar treino</button></div>
 <button class="ghost" id="cancel">Cancelar treino sem salvar</button><div id="cwrap"></div>`;
 app.querySelectorAll("[data-fig]").forEach(h=>figure(h,h.dataset.fig,true));
 app.querySelectorAll("[data-i]").forEach(c=>{const f=()=>{unlockAudio();RUN.idx=+c.dataset.i;saveRun();go("runEx")};c.onclick=f;c.onkeydown=e=>{if(e.key==="Enter")f()}});
 $("#cont").onclick=()=>{unlockAudio();const i=RUN.exs.findIndex(e=>doneCount(e)<e.sets.length);RUN.idx=i<0?RUN.idx:i;saveRun();go("runEx")};
 $("#fim").onclick=()=>go("finish");
 $("#cancel").onclick=()=>{$("#cwrap").innerHTML=`<div class="card"><p style="margin:0 0 8px">Descartar este treino? Nada será salvo no histórico.</p><div class="row"><button class="danger" id="sim">Descartar</button><button id="nao">Voltar</button></div></div>`;
  $("#sim").onclick=()=>{const id=RUN.alunoId;RUN=null;saveRun();D.mode==="aluno"?go("meu"):go("aluno",{id})};$("#nao").onclick=()=>render()};
};
function exElapsed(){return RUN.exAcc+(RUN.exStart?(Date.now()-RUN.exStart)/1000:0)}
function setEx(i){RUN.exAcc=0;RUN.exStart=Date.now();RUN.idx=i;saveRun()}
VIEWS.runEx=()=>{
 if(!RUN)return go("alunos");
 const i=RUN.idx,e=RUN.exs[i],lib=LIB[e.ex]||{};
 if(RUN.exStart===null&&!RUN.exPaused){RUN.exStart=Date.now();saveRun()}
 const nxt=e.sets.findIndex(s=>!s.feito);
 app.innerHTML=`<div class="timerbar"><button class="icon" id="lista" aria-label="Ver lista de exercícios" style="background:transparent;color:var(--accent-ink);border-color:var(--accent-ink)">☰</button>
  <div class="grow" style="min-width:0"><div style="font-family:var(--display);font-weight:700;font-size:1.25rem;overflow-wrap:anywhere">${esc(exNome(e))}</div><div class="small">Exercício ${i+1} de ${RUN.exs.length}</div></div>
  <div style="text-align:right"><div class="big" id="tTot">${mmss((Date.now()-RUN.inicio)/1000)}</div><div class="small">treino</div></div></div>
 <div class="card"><div class="stage" id="stage"></div>
  ${lib.musc?`<div style="text-align:center;margin-top:10px"><span class="chip">Trabalha: ${lib.musc}</span><div class="small muted" style="margin-top:4px">${lib.arr?"Azul = músculo em ação · seta = movimento de esforço":"Azul = músculo em ação"}</div></div>`:""}
  <div class="row" style="justify-content:center;margin-top:10px"><span class="muted small">Tempo no exercício</span><b class="mono" id="tEx" style="font-size:1.2rem">${mmss(exElapsed())}</b><button class="icon" id="pEx" aria-label="${RUN.exStart?"Pausar":"Retomar"} cronômetro do exercício">${RUN.exStart?"❚❚":"▶"}</button><button class="icon" id="zEx" aria-label="Zerar cronômetro do exercício">↺</button></div></div>
 <div id="restBox"></div>
 <div class="card"><div class="row" style="margin-bottom:8px"><h3 class="grow">Séries</h3><span class="muted small">descanso ${e.descanso} s</span></div>
  <div class="sets">${e.sets.map((s,j)=>`<div class="set"><button class="bub ${s.feito?"done":j===nxt?"next":""}" data-s="${j}" aria-pressed="${s.feito}" aria-label="Série ${j+1} ${s.feito?"feita":"pendente"}">${s.feito?"✓":j+1}</button>
   <div><label for="r${j}">${isTempo(e)?"Segundos":"Repetições"}</label><input id="r${j}" inputmode="text" data-j="${j}" data-k="reps" value="${s.reps}"></div>
   <div><label for="c${j}">Carga que você usou (kg)</label><input id="c${j}" inputmode="decimal" data-j="${j}" data-k="carga" placeholder="anote aqui" value="${+s.carga>0?s.carga:""}"></div></div>`).join("")}</div>
  ${e.obs?`<p class="small" style="margin:10px 0 0"><b>Obs. da personal:</b> ${esc(e.obs)}</p>`:""}</div>
 ${lib.do?`<div class="card"><div class="muted small" style="font-weight:600">Como fazer</div><ul class="tips do">${lib.do.map(t=>`<li>${t}</li>`).join("")}</ul>
  <div class="muted small" style="font-weight:600;margin-top:8px">Evite</div><ul class="tips dont">${lib.dont.map(t=>`<li>${t}</li>`).join("")}</ul></div>`:""}
 <div class="row" style="position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:8px">
  <button class="icon" id="prev" aria-label="Exercício anterior" ${i?"":"disabled"}>‹</button>
  <button class="ok grow" id="feito" style="min-height:52px;font-size:1.05rem">${nxt<0?"Exercício concluído · próximo":"Série "+(nxt+1)+" realizada"}</button>
  <button class="icon" id="next" aria-label="Próximo exercício" ${i<RUN.exs.length-1?"":"disabled"}>›</button></div>`;
 figure($("#stage"),e.ex,false);
 renderRest();
 $("#lista").onclick=()=>go("run");
 $("#prev").onclick=()=>{setEx(i-1);render()};$("#next").onclick=()=>{setEx(i+1);render()};
 $("#pEx").onclick=()=>{if(RUN.exStart){RUN.exAcc=exElapsed();RUN.exStart=null;RUN.exPaused=true}else{RUN.exStart=Date.now();RUN.exPaused=false}saveRun();render()};
 $("#zEx").onclick=()=>{RUN.exAcc=0;RUN.exStart=RUN.exStart?Date.now():null;saveRun();$("#tEx").textContent="00:00"};
 app.querySelectorAll("[data-k]").forEach(inp=>inp.onchange=()=>{const s=e.sets[+inp.dataset.j];if(inp.dataset.k==="reps"){s.reps=numOrTxt(inp.value)||0}else{const v=parseFloat(inp.value.replace(",","."));s[inp.dataset.k]=isNaN(v)?0:v};
  if(inp.dataset.k==="carga")e.sets.forEach((o,k)=>{if(k>+inp.dataset.j&&!o.feito)o.carga=s.carga});saveRun();
  if(inp.dataset.k==="carga")e.sets.forEach((o,k)=>{const x=$("#c"+k);if(x&&x!==inp)x.value=+o.carga>0?o.carga:""})});
 app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{unlockAudio();const s=e.sets[+b.dataset.s];s.feito=!s.feito;if(s.feito)startRest(e);saveRun();render()});
 $("#feito").onclick=()=>{unlockAudio();
  if(nxt<0){if(i<RUN.exs.length-1){setEx(i+1);render()}else go("finish");return}
  e.sets[nxt].feito=true;
  if(e.sets.every(s=>s.feito)){RUN.exAcc=exElapsed();RUN.exStart=null}
  startRest(e);saveRun();render()};
};
function startRest(e){const d=Math.max(5,+e.descanso||60);RUN.rest={end:Date.now()+d*1000,total:d,alarmed:false};keepAwake()}
function renderRest(){
 const box=document.getElementById("restBox");if(!box)return;
 if(!RUN.rest){box.innerHTML="";return}
 const left=(RUN.rest.end-Date.now())/1000,over=left<=0;
 box.innerHTML=`<div class="rest ${over?"alarm":""}" role="timer"><div class="muted small" style="font-weight:600">${over?"Hora de voltar!":"Descanso"}</div>
  <div class="clock" id="tRest">${over?"00:00":mmss(Math.ceil(left))}</div>
  <div class="bar"><i id="bRest" style="width:${over?100:Math.round((1-left/RUN.rest.total)*100)}%"></i></div>
  <div class="row" style="justify-content:center">${over?'<button class="ok" id="rOk">Voltar ao treino</button>':'<button id="rMinus">−15 s</button><button id="rPlus">+15 s</button><button class="pri" id="rSkip">Pular descanso</button>'}</div></div>`;
 const clear=()=>{RUN.rest=null;saveRun();renderRest()};
 if(over)box.querySelector("#rOk").onclick=clear;
 else{box.querySelector("#rSkip").onclick=clear;
  box.querySelector("#rPlus").onclick=()=>{RUN.rest.end+=15000;RUN.rest.total+=15;saveRun();renderRest()};
  box.querySelector("#rMinus").onclick=()=>{RUN.rest.end-=15000;saveRun();renderRest()}}
}
setInterval(()=>{
 if(!RUN)return;
 const t=document.getElementById("tTot");if(t)t.textContent=mmss((Date.now()-RUN.inicio)/1000);
 const te=document.getElementById("tEx");if(te)te.textContent=mmss(exElapsed());
 if(RUN.rest){const left=(RUN.rest.end-Date.now())/1000;
  if(left<=0&&!RUN.rest.alarmed){RUN.rest.alarmed=true;saveRun();beep();renderRest();if(V.name!=="runEx")toast("Descanso terminado: hora de voltar!")}
  else if(left>0){const tr=document.getElementById("tRest");if(tr)tr.textContent=mmss(Math.ceil(left));const br=document.getElementById("bRest");if(br)br.style.width=Math.round((1-left/RUN.rest.total)*100)+"%"}}
},250);

VIEWS.finish=()=>{
 if(!RUN)return go(home());
 const tot=RUN.exs.reduce((n,e)=>n+e.sets.length,0),fe=RUN.exs.reduce((n,e)=>n+doneCount(e),0);
 const dur=(Date.now()-RUN.inicio)/1000;
 app.innerHTML=`<div class="top"><button class="icon ghost" id="back" aria-label="Voltar">‹</button><h1>Finalizar treino</h1></div>
 <div class="card two"><div><div class="muted small">Duração</div><b class="mono" style="font-size:1.4rem">${mmss(dur)}</b></div><div><div class="muted small">Séries feitas</div><b class="mono" style="font-size:1.4rem">${fe} de ${tot}</b></div></div>
 ${fe<tot?'<div class="banner">Algumas séries não foram marcadas. Elas ficam registradas como não feitas.</div>':""}
 <label class="card row" ${D.mode==="aluno"?"hidden":""} style="color:var(--ink);font-size:.95rem;font-weight:400;margin:0"><input type="checkbox" id="upd" style="width:22px;min-height:22px"><span class="grow">Atualizar as cargas do treino com as usadas hoje</span></label>
 ${D.mode==="aluno"&&D.ficha&&D.ficha.personal&&D.ficha.personal.whats?'<a class="btn ok" id="okw" target="_blank" rel="noopener" style="text-align:center;text-decoration:none;display:block;min-height:52px;padding:15px 14px">Salvar e enviar para a personal no WhatsApp</a>':""}
 <button class="${D.mode==="aluno"&&D.ficha&&D.ficha.personal&&D.ficha.personal.whats?"":"ok"}" id="ok" style="min-height:52px">Salvar no histórico</button>`;
 $("#back").onclick=()=>go("run");
 const mkH=()=>({id:uid(),alunoId:RUN.alunoId,alunoNome:RUN.alunoNome,letra:RUN.letra,grupos:RUN.grupos||"",inicio:RUN.inicio,dur:Math.round(dur),feitas:fe,total:tot,
   exs:RUN.exs.map(e=>({nome:exNome(e),ex:e.ex,sets:e.sets.map(s=>({reps:s.reps,carga:s.carga,feito:s.feito}))}))});
 const doSave=async(h)=>{
  saveHist(h);
  if($("#upd").checked){const a=D.alunos.find(x=>x.id===RUN.alunoId);const t=a&&a.treinos&&a.treinos[RUN.letra];
   if(t){const exs=t.exs.map(te=>{const r=RUN.exs.find(x=>x.id===te.id);if(!r)return te;const feitas=r.sets.filter(s=>s.feito);return feitas.length?{...te,carga:feitas[feitas.length-1].carga}:te});
    saveAluno({...a,treinos:{...a.treinos,[RUN.letra]:{...t,exs}}})}}
  try{wake&&wake.release()}catch(e){}
  RUN=null;saveRun();toast("Treino salvo no histórico");go("histDet",{id:h.id})};
 $("#ok").onclick=()=>doSave(mkH());
 if($("#okw")){const hw=mkH();$("#okw").href="https://wa.me/"+String(D.ficha.personal.whats).replace(/\D/g,"")+"?text="+encodeURIComponent(resumo(hw));$("#okw").onclick=()=>{doSave(hw)}}
};

/* ---------- Histórico ---------- */
const ORDENS={recente:["Última execução",(a,b)=>b.inicio-a.inicio],antigo:["Primeira execução",(a,b)=>a.inicio-b.inicio],rapido:["Mais rápido",(a,b)=>a.dur-b.dur],lento:["Mais demorado",(a,b)=>b.dur-a.dur]};
VIEWS.hist=()=>{
 const ord=V.ord||lsGet("ft-ord","recente"),al=V.al||"";
 const list=D.hist.filter(h=>!al||h.alunoId===al).slice().sort(ORDENS[ord][1]);
 const nomes=[...new Map([...D.alunos.map(a=>[a.id,a.nome]),...D.hist.map(h=>[h.alunoId,(D.alunos.find(a=>a.id===h.alunoId)||{}).nome||h.alunoNome])]).entries()].sort((a,b)=>String(a[1]).localeCompare(String(b[1]),"pt-BR"));
 app.innerHTML=`${banner()}<div class="top"><h1>Histórico</h1></div>
 <div class="two"><div><label for="ord">Ordenar por</label><select id="ord">${Object.entries(ORDENS).map(([k,[l]])=>`<option value="${k}" ${k===ord?"selected":""}>${l}</option>`).join("")}</select></div>
 <div ${D.mode==="aluno"?"hidden":""}><label for="al">Aluno</label><select id="al"><option value="">Todos</option>${nomes.map(([id,n])=>`<option value="${id}" ${id===al?"selected":""}>${esc(n)}</option>`).join("")}</select></div></div>
 <div class="list">${list.map(h=>`<div class="card hist tap" tabindex="0" data-h="${h.id}"><div><b style="color:var(--accent)">Treino ${h.letra}</b> <span class="muted">· ${esc((D.alunos.find(a=>a.id===h.alunoId)||{}).nome||h.alunoNome)}</span>
  <div class="small muted">${esc(h.grupos)}</div><div class="small mono">${fmtData(h.inicio)} · ${fmtDia(h.inicio)}</div></div>
  <div class="dur">${mmss(h.dur)}<small>duração</small></div></div>`).join("")}</div>
 ${list.length&&D.mode!=="aluno"?'<div id="delwrap"><button class="danger" id="delAll">'+(al?"Apagar histórico deste aluno":"Apagar todo o histórico")+'</button></div>':""}
 ${!D.hist.length?'<div class="card empty"><h2>Nenhum treino registrado</h2><p class="muted" style="margin:0">Quando um aluno finalizar um treino, ele aparece aqui com a duração e as cargas usadas.</p></div>':""}`;
 const da=$("#delAll");if(da)da.onclick=()=>{$("#delwrap").innerHTML=`<div class="card"><p class="small" style="margin:0 0 8px">${al?"Apagar o histórico deste aluno?":"Apagar todo o histórico?"} São ${list.length} treino(s) registrado(s). Os alunos e os treinos montados não são apagados.</p><div class="row"><button class="danger" id="sim">Apagar</button><button id="nao">Cancelar</button></div></div>`;
  $("#sim").onclick=async()=>{await deleteHist(list.map(h=>h.id));toast("Histórico apagado");V.al="";render()};$("#nao").onclick=()=>render()};
 $("#ord").onchange=()=>{lsSet("ft-ord",$("#ord").value);V.ord=$("#ord").value;render()};
 $("#al").onchange=()=>{V.al=$("#al").value;render()};
 app.querySelectorAll("[data-h]").forEach(c=>{const f=()=>go("histDet",{id:c.dataset.h,ord:V.ord,al:V.al});c.onclick=f;c.onkeydown=e=>{if(e.key==="Enter")f()}});
};
VIEWS.histDet=()=>{
 const h=D.hist.find(x=>x.id===V.id);if(!h)return go("hist");
 app.innerHTML=`<div class="top"><button class="icon ghost" id="back" aria-label="Voltar">‹</button><h1>Treino ${h.letra} · ${esc(h.alunoNome)}</h1></div>
 <div class="card two"><div><div class="muted small">Data</div><b>${fmtData(h.inicio)}</b><div class="small muted">${fmtDia(h.inicio)}</div></div><div><div class="muted small">Duração</div><b class="mono" style="font-size:1.3rem">${mmss(h.dur)}</b><div class="small muted">${h.feitas} de ${h.total} séries</div></div></div>
 <div class="card fields"><b>${D.mode==="aluno"?"Mande este treino para sua personal":"Resumo para enviar"}</b><span class="small muted">Copie o resumo e cole no WhatsApp.</span>${D.mode==="aluno"&&D.ficha&&D.ficha.personal&&D.ficha.personal.whats?'<a class="btn pri" id="wsend" target="_blank" rel="noopener" style="text-align:center;text-decoration:none;display:block;padding:13px 14px">Enviar para a personal no WhatsApp</a>':""}<button class="${D.mode==="aluno"&&D.ficha&&D.ficha.personal&&D.ficha.personal.whats?"":"pri"}" id="res">Copiar resumo do treino</button><span class="small" id="rst" aria-live="polite"></span><textarea id="rtx" readonly hidden aria-label="Resumo do treino"></textarea></div>
 <div class="list">${h.exs.map(e=>`<div class="card"><b>${esc(e.nome)}</b><div class="rx" style="margin-top:6px;display:grid;gap:2px">${e.sets.map((s,j)=>`<span style="color:${s.feito?"var(--ink)":"var(--muted)"}">${s.feito?"✓":"·"} Série ${j+1}: ${s.reps}${LIB[e.ex]&&LIB[e.ex].tempo?" s":" reps"}${+s.carga>0?" · "+carga(s.carga):" · carga não anotada"}${s.feito?"":" (não feita)"}</span>`).join("")}</div></div>`).join("")}</div>
 ${D.mode==="aluno"?"":'<div id="delwrap"><button class="danger" id="delH">Excluir este registro</button></div>'}`;
 $("#back").onclick=()=>go("hist",{ord:V.ord,al:V.al});
 if($("#delH"))$("#delH").onclick=()=>{$("#delwrap").innerHTML=`<div class="card"><p class="small" style="margin:0 0 8px">Excluir este treino do histórico? Os exercícios do treino continuam salvos.</p><div class="row"><button class="danger" id="sim">Excluir</button><button id="nao">Cancelar</button></div></div>`;
  $("#sim").onclick=async()=>{await deleteHist([h.id]);toast("Registro excluído");go("hist",{ord:V.ord,al:V.al})};$("#nao").onclick=()=>render()};
 if($("#wsend"))$("#wsend").href="https://wa.me/"+String(D.ficha.personal.whats).replace(/\D/g,"")+"?text="+encodeURIComponent(resumo(h));
 $("#res").onclick=()=>{const txt=resumo(h);const ok=()=>$("#rst").textContent="Resumo copiado. Cole no WhatsApp.";
  const fb=()=>{const t=$("#rtx");t.value=txt;t.hidden=false;t.select();$("#rst").textContent="Texto selecionado abaixo. Use copiar do celular."};
  try{navigator.clipboard.writeText(txt).then(ok,fb)}catch(e){fb()}};
};
function resumo(h){
 const lin=h.exs.map(e=>{const t=LIB[e.ex]&&LIB[e.ex].tempo;return"• "+e.nome+": "+e.sets.map(s=>(s.feito?"✓ ":"✗ ")+s.reps+(t?"s":"")+(+s.carga>0?" × "+s.carga+"kg":"")).join(" | ")});
 return`Treino ${h.letra} · ${h.alunoNome}\n${fmtData(h.inicio)} (${fmtDia(h.inicio)})\nDuração ${mmss(h.dur)} · ${h.feitas} de ${h.total} séries\n\n${lin.join("\n")}`;
};

/* ---------- Telas: entrar, assinatura, admin ---------- */
const LOGO='<svg viewBox="0 0 34 20" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 11h7l3-8 5 15 4-11 2 4h11"/></svg>';
VIEWS.auth=()=>{
 const t=V.tab||"entrar",role=V.role||"personal",criar=t==="criar";
 app.innerHTML=`<div class="hero"><div class="brand">${LOGO}Pulso</div><h1>${criar?"Criar conta":"Entrar"}</h1><div class="sub">Treinos de academia, do jeito da sua personal.</div></div>
 ${V.msg?`<div class="banner">${esc(V.msg)}</div>`:""}
 <div class="row"><button type="button" class="grow ${!criar?"pri":""}" id="tE">Entrar</button><button type="button" class="grow ${criar?"pri":""}" id="tC">Criar conta</button></div>
 <form class="card fields" id="f" novalidate>
  ${criar?`<div><label>Eu sou</label><div class="row"><button type="button" class="grow ${role==="personal"?"pri":""}" id="rP">Personal</button><button type="button" class="grow ${role==="aluno"?"pri":""}" id="rA">Aluno</button></div></div>
  <div><label for="nm">Seu nome</label><input id="nm" autocomplete="name" value="${esc(V.nm)}"></div>
  ${role==="personal"?`<div><label for="wp">WhatsApp (seus alunos veem)</label><input id="wp" type="tel" inputmode="tel" placeholder="+595 9xx xxx xxx" autocomplete="tel" value="${esc(V.wp)}"></div>`:""}`:""}
  <div><label for="em">E-mail</label><input id="em" type="email" inputmode="email" autocapitalize="none" autocomplete="email" value="${esc(V.em)}"></div>
  <div><label for="pw">Senha</label><input id="pw" type="password" autocomplete="${criar?"new-password":"current-password"}" placeholder="${criar?"mínimo 6 caracteres":""}"></div>
  <div class="err" id="e-f" hidden></div>
  <button class="pri grad" type="submit" id="go">${criar?"Criar conta":"Entrar"}</button>
  ${criar&&role==="aluno"?'<p class="small muted" style="margin:0">Depois de criar a conta, digite o código que sua personal te deu.</p>':""}
 </form>`;
 const keep=()=>{["em","nm","wp"].forEach(k=>{const e=$("#"+k);if(e)V[k]=e.value})};
 const sw=(k,v)=>()=>{keep();V[k]=v;V.msg="";render()};
 $("#tE").onclick=sw("tab","entrar");$("#tC").onclick=sw("tab","criar");
 if(criar){$("#rP").onclick=sw("role","personal");$("#rA").onclick=sw("role","aluno")}
 $("#f").onsubmit=async e=>{e.preventDefault();keep();
  const er=$("#e-f"),fail=m=>{er.textContent=m;er.hidden=false;$("#go").disabled=false};
  const em=(V.em||"").trim(),pw=$("#pw").value,nm=(V.nm||"").trim();
  if(!/^\S+@\S+\.\S+$/.test(em))return fail("Digite um e-mail válido.");
  if(pw.length<6)return fail("A senha precisa ter pelo menos 6 caracteres.");
  if(criar&&!nm)return fail("Digite seu nome.");
  $("#go").disabled=true;er.hidden=true;
  try{
   let r;
   if(criar)r=await sb.auth.signUp({email:em,password:pw,options:{data:{role,nome:nm,whatsapp:role==="personal"?(V.wp||"").trim():""}}});
   else r=await sb.auth.signInWithPassword({email:em,password:pw});
   if(r.error){const m=r.error.message||"";
    return fail(/invalid login/i.test(m)?"E-mail ou senha incorretos.":/already registered/i.test(m)?"Este e-mail já tem conta. Use Entrar.":/rate limit|too many/i.test(m)?"Muitas tentativas. Espere um pouco.":"Não deu certo. Tente de novo.")}
   if(!r.data.session)return fail("Conta criada. Confirme pelo e-mail que enviamos e depois entre.");
   V={name:"loading"};D.mode="loading";render();await enter(r.data.user);
  }catch(x){fail("Sem internet agora. Tente de novo.")}
 };
};
VIEWS.pendente=()=>{
 app.innerHTML=`<div class="hero"><div class="brand">${LOGO}Pulso</div><h1>Quase lá, ${esc((D.perfil&&D.perfil.nome||"").split(" ")[0])}!</h1><div class="sub">Sua conta foi criada.</div></div>
 <div class="card fields"><h2>Assinatura ainda não ativa</h2><p style="margin:0">O acesso da personal é liberado depois do pagamento. Assim que o pagamento for confirmado, toque em “Verificar de novo”.</p>
 <button class="pri" id="ver">Verificar de novo</button>${D.admin?'<button id="adm">Abrir painel do administrador</button>':""}<button class="ghost" id="sair">Sair</button></div>`;
 $("#ver").onclick=async()=>{$("#ver").disabled=true;D.mode="loading";render();await enter({id:D.uid,email:D.email})};
 $("#adm")&&($("#adm").onclick=openAdmin);$("#sair").onclick=sair;
};
const openAdmin=()=>{D.adm=null;go("admin")};
async function loadAdmin(){
 const [p,s]=await Promise.all([sb.from("profiles").select("id,nome,email,whatsapp,criado").eq("role","personal").order("criado",{ascending:false}),sb.from("assinaturas").select("*")]);
 if(p.error||s.error){D.adm=[];toast("Não consegui carregar.");render();return}
 const m=new Map((s.data||[]).map(x=>[x.personal_id,x]));
 D.adm=(p.data||[]).map(x=>({...x,pago:!!(m.get(x.id)||{}).pago,ate:(m.get(x.id)||{}).ate||""}));
 render();
}
VIEWS.admin=()=>{
 if(!D.admin)return go(home());
 if(D.adm===null){app.innerHTML='<p class="muted">Carregando…</p>';loadAdmin();return}
 app.innerHTML=`<div class="top"><button class="icon ghost" id="back" aria-label="Voltar">‹</button><h1>Administrador</h1></div>
 <div class="small muted">Personais cadastradas. Só você marca quem está com a assinatura paga.</div>
 <div class="list">${D.adm.map(p=>`<div class="card fields"><div class="row"><div class="grow" style="min-width:0"><b>${esc(p.nome||"(sem nome)")}</b><div class="small muted" style="overflow-wrap:anywhere">${esc(p.email)}${p.whatsapp?" · "+esc(p.whatsapp):""}</div></div><span class="chip" style="${p.pago?"background:var(--ok-soft);color:var(--ok)":"background:var(--bad-soft);color:var(--bad)"}">${p.pago?"Pago":"Não pago"}</span></div>
  <div><label for="d-${p.id}">Vence em (opcional)</label><input type="date" id="d-${p.id}" value="${esc(p.ate)}"></div>
  <div class="row"><button class="grow ${p.pago?"danger":"ok"}" data-t="${p.id}">${p.pago?"Marcar como não pago":"Marcar como pago"}</button><button data-sv="${p.id}">Salvar data</button></div></div>`).join("")}</div>
 ${!D.adm.length?'<div class="card empty"><p class="muted" style="margin:0">Nenhuma personal cadastrada ainda.</p></div>':""}`;
 $("#back").onclick=()=>go(home());
 const upd=async(id,patch)=>{const {error}=await sb.from("assinaturas").upsert({personal_id:id,...patch});if(error){toast(errMsg(error));return}toast("Salvo");D.adm=null;render()};
 app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const p=D.adm.find(x=>x.id===b.dataset.t);upd(p.id,{pago:!p.pago,ate:$("#d-"+p.id).value||null})});
 app.querySelectorAll("[data-sv]").forEach(b=>b.onclick=()=>{const p=D.adm.find(x=>x.id===b.dataset.sv);upd(p.id,{pago:p.pago,ate:$("#d-"+p.id).value||null})});
};

if(RUN)V={name:"run"};
boot();
</script>
</body></html>
